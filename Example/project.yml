name: TVProfilePickerDemo
options:
  bundleIdPrefix: io.github.halilozel1903
  deploymentTarget:
    tvOS: "17.0"
packages:
  TVProfilePicker:
    path: ..
targets:
  ProfilesTV:
    type: application
    platform: tvOS
    sources:
      - TV
    dependencies:
      - package: TVProfilePicker
        product: TVProfilePicker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.ProfilesTV
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Profiles
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        # No asset catalog: a tvOS icon needs a layered App Icon & Top Shelf brand assets set,
        # which a demo does not need, so the app builds without an icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "3"
schemes:
  ProfilesTV:
    build:
      targets:
        ProfilesTV: all
    run:
      config: Debug
